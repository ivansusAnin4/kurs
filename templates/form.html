{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<h1>🔐 Вход в систему</h1>

{% if error %}
<div class="error-message" style="color: red; background: #ffeeee; padding: 10px; border-radius: 5px; margin-bottom: 20px;">
    ⚠️ {{ error }}
</div>
{% endif %}


<form method="post" action="/login" class="auth-form">
    <div class="form-group">
        <label for="username">Имя пользователя:</label>
        <input type="text" id="username" name="username" required>
    </div>
    
    <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" required>
    </div>
    
    <button type="submit" class="button">Войти</button>
</form>

<p style="margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px;">
    <strong>Тестовые данные:</strong> admin / admin
</p>

<a href="/" class="button">На главную</a>
{% endblock %}
