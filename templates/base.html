<!DOCTYPE html> 
<html lang="ru"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>{% block title %}Books market{% endblock %}</title> 
    
    {% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    {% endblock %}
    
    {% block meta %}{% endblock %}
</head> 
<body> 
    <nav> 
        <div class="container">
            <div class="logo">
                Библиотека
            </div>
            <div class="nav-links">
                <a href="/index">Главная</a> 
                <a href="/detail">О нас</a> 
                <a href="/items">Товары</a>
                <a href="/search">Поиск</a>
                <a href="/feedback">Отзывы</a>
                <a href="/profile">Профиль</a>  
                <a href="/login">Вход</a>
                <a href="/admin/dashboard">Админ-панель</a>
            </div>
        </div>
    </nav> 
    
    <div class="content"> 
        {% block content %} 
        {% endblock %} 
    </div> 
    
    <footer>
        <div class="container">
            <p>&copy; 2026 Books market Все права защищены.</p>
        </div>
    </footer>
    
    {% block scripts %}{% endblock %}
</body> 
</html>
